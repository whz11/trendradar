      name: "政策｜中国政府网-最新政策"
      url: "https://rsshub.app/gov/zhengce/zuixin"
      enabled: false
      max_age_days: 3

    - id: "gov-department-news"
      name: "政策｜中国政府网-部门政务"
      url: "https://rsshub.app/gov/news/bm"
      enabled: false
      max_age_days: 3

    - id: "gov-policy-files"
      name: "政策｜国务院政策文件"
      url: "https://rsshub.app/gov/zhengce/wenjian"
      enabled: false
      max_age_days: 7

    - id: "miit-policy"
      name: "政策｜工信部-政策文件"
      url: "https://rsshub.app/gov/miit/zcwj"
      enabled: false
      max_age_days: 7

    - id: "miit-policy-explain"
      name: "政策｜工信部-政策解读"
      url: "https://rsshub.app/gov/miit/zcjd"
      enabled: false
      max_age_days: 7

    - id: "miit-consultation"
      name: "政策｜工信部-意见征集"
      url: "https://rsshub.app/gov/miit/yjzj"
      enabled: false
      max_age_days: 7

    - id: "npc-authoritative"
      name: "政策｜全国人大-权威发布"
      url: "https://rsshub.app/gov/npc/c12435"
      enabled: false
      max_age_days: 7

    - id: "npc-legislation"
      name: "政策｜全国人大-立法"
      url: "https://rsshub.app/gov/npc/c183"
      enabled: false
      max_age_days: 7

    - id: "moj-legislation"
      name: "政策｜司法部-立法意见征集"
      url: "https://rsshub.app/gov/moj/lfyjzj"
      enabled: false
      max_age_days: 7


    # ===========================================================
    # 02 AI / Agent 官方能力
    # ===========================================================

    - id: "openai-news"
      name: "AI｜OpenAI"
      url: "https://openai.com/news/rss.xml"
      enabled: true
      max_age_days: 5

    - id: "anthropic-engineering"
      name: "Agent｜Anthropic Engineering"
      url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/refs/heads/main/feeds/feed_anthropic_engineering.xml"
      enabled: true
      max_age_days: 5

    - id: "anthropic-news"
      name: "AI｜Anthropic News"
      url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/refs/heads/main/feeds/feed_anthropic_news.xml"
      enabled: true
      max_age_days: 5

    - id: "google-ai"
      name: "AI｜Google AI"
      url: "https://blog.google/innovation-and-ai/technology/ai/rss/"
      enabled: true
      max_age_days: 5

    - id: "deepmind"
      name: "AI｜Google DeepMind"
      url: "https://deepmind.google/blog/rss.xml"
      enabled: true
      max_age_days: 5

    - id: "huggingface"
      name: "AI｜Hugging Face"
      url: "https://huggingface.co/blog/feed.xml"
      enabled: true
      max_age_days: 5


    # ===========================================================
    # 03 AI应用 / Agent真实落地
    #
    # 当前最重要的一类 RSS。
    # ===========================================================

    - id: "aws-ai-ml"
      name: "应用案例｜AWS AI & Machine Learning"
      url: "https://aws.amazon.com/blogs/machine-learning/feed/"
      enabled: true
      max_age_days: 5

    - id: "google-cloud"
      name: "应用案例｜Google Cloud"
      url: "https://cloudblog.withgoogle.com/rss/"
      enabled: true
      max_age_days: 5


    # ===========================================================
    # 04 网络安全 / AI安全
    #
    # 只保留少量高质量来源。
    # ===========================================================

    - id: "google-threat-intelligence"
      name: "安全｜Google Threat Intelligence / Mandiant"
      url: "https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v"
      enabled: true
      max_age_days: 5

    - id: "unit42"
      name: "安全｜Palo Alto Unit 42"
      url: "https://unit42.paloaltonetworks.com/feed/"
