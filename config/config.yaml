# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#               AI应用 + 每日综合情报版
#
# 核心目标：
#   1. 每日时政 / 政策 / 经济民生不能缺失
#   2. AI / Agent 应用落地作为核心专业方向
#   3. 重点发现有启发性的 Agent 创意
#   4. 保留能明显改变 AI 应用能力的关键工程技术
#   5. 网络安全仅保留少量高价值信息
#
# Version: 2.4.0
# ═══════════════════════════════════════════════════════════════


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true


# ===============================================================
# 1.5 调度
#
# 不使用 TrendRadar 内部时间段调度。
# 每天何时运行由 GitHub Actions cron 控制。
#
# 关闭以后，每次运行：
# collect = true
# analyze = true
# push = true
#
# 因此 GitHub Actions 建议每天只执行一次。
# ===============================================================
schedule:
  enabled: false
  preset: "always_on"


# ===============================================================
# 2. 热榜平台
#
# 作用：
#   时政 / 政策 / 经济 / 民生 / 科技产业 / 社会热点
#
# 其中部分平台同时加入 standalone，
# 保证时政热点不会因为 AI 兴趣筛选而消失。
# ===============================================================
platforms:
  enabled: true
  api_url: ""

  sources:

    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"

    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"

    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"

    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"

    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"

    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"

    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"

    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"


# ===============================================================
# 3. RSS
#
# 核心方向：
#
# AI应用 / Agent落地
# AI产品能力
# 企业Agent工程案例
# 少量AI安全
#
# 论文暂时关闭。
# ===============================================================
rss:
  enabled: true

  freshness_filter:
    enabled: true
    max_age_days: 3

  feeds:

    # ===========================================================
    # 01 国家政策
    #
    # 公共 rsshub.app 在 GitHub Actions 中目前出现 403。
    # 暂时关闭。
    #
    # 后续部署自有 RSSHub 后重新开启。
    # ===========================================================

