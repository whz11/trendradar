```yaml
# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#              DeepSeek · 每日综合情报简报版
#
# 适用方向：
#   - AI / 大模型 / Agent
#   - AI Security / Agent Security
#   - 网络安全 / 威胁情报
#   - 国家政策 / 数字政府
#   - 宏观经济 / 民生
#
# Version: 2.4.0
# ═══════════════════════════════════════════════════════════════


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true


# ===============================================================
# 1.5 调度系统
#
# office_hours：
#   工作日按“到岗 / 午间 / 收工”节奏运行
#   更适合作为工作情报简报
#
# 具体时间由 config/timeline.yaml 控制
# ===============================================================
schedule:
  enabled: true
  preset: "office_hours"


# ===============================================================
# 2. 数据源 - 热榜平台
#
# 热榜主要用于：
#   - 国家 / 社会热点
#   - 宏观经济
#   - 民生
#   - 舆情感知
#
# 专业 AI / 网络安全资讯主要依靠 RSS
# ===============================================================
platforms:
  enabled: true
  api_url: ""

  sources:

    # -----------------------------------------------------------
    # 综合新闻 / 政策 / 民生
    # -----------------------------------------------------------

    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"

    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"

    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"

    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"

    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"


    # -----------------------------------------------------------
    # 宏观经济 / 金融
    # -----------------------------------------------------------

    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"

    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"


    # -----------------------------------------------------------
    # 技术 / 社区观点
    # -----------------------------------------------------------

    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"


# ===============================================================
# 3. 数据源 - RSS
# ===============================================================
rss:
  enabled: true

  freshness_filter:
    enabled: true
    max_age_days: 2

  feeds:

    # ===========================================================
    # 01 国家政策 / 政务
    #
    # 当前使用公共 RSSHub
    # 后续建议自建 RSSHub 后替换 rsshub.app
    # ===========================================================

    - id: "gov-policy-latest"
      name: "政策｜中国政府网-最新政策"
      url: "https://rsshub.app/gov/zhengce/zuixin"
      max_age_days: 3

    - id: "gov-department-news"
      name: "政策｜中国政府网-部门政务"
      url: "https://rsshub.app/gov/news/bm"
      max_age_days: 2

    - id: "gov-policy-files"
      name: "政策｜国务院政策文件"
      url: "https://rsshub.app/gov/zhengce/wenjian"
      max_age_days: 7

    - id: "miit-policy"
      name: "政策｜工信部-政策文件"
      url: "https://rsshub.app/gov/miit/zcwj"
      max_age_days: 7

    - id: "miit-policy-explain"
      name: "政策｜工信部-政策解读"
      url: "https://rsshub.app/gov/miit/zcjd"
      max_age_days: 7

    - id: "miit-consultation"
      name: "政策｜工信部-意见征集"
      url: "https://rsshub.app/gov/miit/yjzj"
      max_age_days: 7

    - id: "npc-authoritative"
      name: "政策｜全国人大-权威发布"
      url: "https://rsshub.app/gov/npc/c12435"
      max_age_days: 7

    - id: "npc-legislation"
      name: "政策｜全国人大-立法"
      url: "https://rsshub.app/gov/npc/c183"
      max_age_days: 7

    - id: "moj-legislation"
      name: "政策｜司法部-立法意见征集"
      url: "https://rsshub.app/gov/moj/lfyjzj"
      max_age_days: 7


    # ===========================================================
    # 02 AI / 大模型 / Agent 官方源
    # ===========================================================

    - id: "openai-news"
      name: "AI｜OpenAI"
      url: "https://openai.com/news/rss.xml"
      max_age_days: 3

    - id: "deepmind"
      name: "AI｜Google DeepMind"
      url: "https://deepmind.google/blog/rss.xml"
      max_age_days: 3

    - id: "google-ai"
      name: "AI｜Google AI"
      url: "https://blog.google/innovation-and-ai/technology/ai/rss/"
      max_age_days: 3

    - id: "google-research"
      name: "AI｜Google Research"
      url: "https://research.google/blog/rss/"
      max_age_days: 3

    - id: "huggingface"
      name: "AI｜Hugging Face"
      url: "https://huggingface.co/blog/feed.xml"
      max_age_days: 3

    - id: "anthropic-engineering"
      name: "AI｜Anthropic Engineering"
      url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/refs/heads/main/feeds/feed_anthropic_engineering.xml"
      max_age_days: 3

    - id: "anthropic-news"
      name: "AI｜Anthropic News"
      url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/refs/heads/main/feeds/feed_anthropic_news.xml"
      max_age_days: 3


    # ===========================================================
    # 03 AI / Agent / 网络安全论文
    # ===========================================================

    - id: "arxiv-ai"
      name: "论文｜arXiv cs.AI"
      url: "https://export.arxiv.org/rss/cs.AI"
      max_age_days: 2

    - id: "arxiv-cl"
      name: "论文｜arXiv cs.CL"
      url: "https://export.arxiv.org/rss/cs.CL"
      max_age_days: 2

    - id: "arxiv-security"
      name: "论文｜arXiv cs.CR"
      url: "https://export.arxiv.org/rss/cs.CR"
      max_age_days: 2


    # ===========================================================
    # 04 网络安全 / 威胁情报
    # ===========================================================

    - id: "google-threat-intelligence"
      name: "安全｜Google Threat Intelligence / Mandiant"
      url: "https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v"
      max_age_days: 3

    - id: "unit42"
      name: "安全｜Palo Alto Unit 42"
      url: "https://unit42.paloaltonetworks.com/feed/"
      max_age_days: 3

    - id: "microsoft-security"
      name: "安全｜Microsoft Security"
      url: "https://www.microsoft.com/en-us/security/blog/feed/"
      max_age_days: 3

    - id: "google-project-zero"
      name: "安全｜Google Project Zero"
      url: "https://googleprojectzero.blogspot.com/feeds/posts/default"
      max_age_days: 7

    - id: "google-security"
      name: "安全｜Google Security Blog"
      url: "https://googleonlinesecurity.blogspot.com/atom.xml"
      max_age_days: 3

    - id: "portswigger-research"
      name: "安全｜PortSwigger Research"
      url: "https://portswigger.net/research/rss"
      max_age_days: 7

    - id: "cloudflare-security"
      name: "安全｜Cloudflare"
      url: "https://blog.cloudflare.com/rss"
      max_age_days: 3

    - id: "krebsonsecurity"
      name: "安全｜Krebs on Security"
      url: "https://krebsonsecurity.com/feed/"
      max_age_days: 3


    # ===========================================================
    # 05 AI Security / Agent Security
    # ===========================================================

    - id: "owasp-genai"
      name: "AI安全｜OWASP GenAI Security"
      url: "https://genai.owasp.org/feed/"
      max_age_days: 7


    # ===========================================================
    # 06 国际技术社区
    # ===========================================================

    - id: "hacker-news"
      name: "技术社区｜Hacker News"
      url: "https://hnrss.org/frontpage"
      max_age_days: 2


    # ===========================================================
    # GitHub Trending
    #
    # 自建 RSSHub 并配置 GitHub Token 后建议开启
    # ===========================================================

    # - id: "github-trending"
    #   name: "技术社区｜GitHub Trending"
    #   url: "http://rsshub:1200/github/trending/daily/any"
    #   max_age_days: 2


# ===============================================================
# 4. 报告模式
#
# 开启 schedule 后，具体模式可被 timeline.yaml 覆盖
# ===============================================================
report:
  mode: "current"

  # 按兴趣标签分类，而不是按来源分类
  display_mode: "keyword"

  # 按 ai_interests.txt 中定义的兴趣优先级展示
  sort_by_position_first: true

  rank_threshold: 5

  # 单个兴趣分类最多展示 8 条
  # 防止某一个领域占满整个简报
  max_news_per_keyword: 8


# ===============================================================
# 4.5 筛选策略
#
# 使用 DeepSeek 对资讯进行语义筛选
# ===============================================================
filter:
  method: "ai"

  # 按 ai_interests.txt 中的定义顺序排列兴趣分类
  priority_sort_enabled: true


# ===============================================================
# 4.6 AI 智能筛选
# ===============================================================
ai_filter:

  # 每批给 DeepSeek 150 条标题
  # 兼顾 API 稳定性和 Token 利用率
  batch_size: 150

  batch_interval: 2

  # 低于 0.65 的资讯不进入最终推荐
  #
  # 0.6：召回较高
  # 0.65：推荐
  # 0.7：偏严格
  # 0.8：容易漏掉潜在重要信息
  min_score: 0.65

  # 兴趣变化不大时尽量复用已有分类
  # 减少重复调用 DeepSeek
  reclassify_threshold: 0.75

  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"


# ===============================================================
# 5. 展示配置
#
# 阅读逻辑：
#
#   AI 今日研判
#       ↓
#   热点资讯
#       ↓
#   专业 RSS
#
# 先看结论，再决定哪些文章值得深入阅读
# ===============================================================
display:

  region_order:
    - ai_analysis
    - hotlist
    - rss

  regions:

    # 国内综合热点
    hotlist: true

    # 避免与 hotlist / rss 重复
    new_items: false

    # AI / Agent / 安全 / 政策核心来源
    rss: true

    # 不直接展示未经筛选的完整平台内容
    standalone: false

    # DeepSeek 生成的综合分析
    ai_analysis: true


  # 当前关闭 standalone
  standalone:
    platforms: []
    rss_feeds: []
    max_items: 10


# ===============================================================
# 6. 推送通知
#
# 推荐顺序：
#
#   1. 飞书
#   2. 企业微信
#   3. Email
#
# Webhook / 密码不要提交到公开 GitHub 仓库
# ===============================================================
notification:
  enabled: true

  channels:

    feishu:
      webhook_url: ""

    dingtalk:
      webhook_url: ""

    wework:
      webhook_url: ""
      msg_type: "markdown"

    telegram:
      bot_token: ""
      chat_id: ""

    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""

    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""

    bark:
      url: ""

    slack:
      webhook_url: ""

    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 7. 存储
#
# SQLite 建议长期保留
# 后续可以用于：
#
#   - MCP 查询历史资讯
#   - RAG
#   - 趋势分析
#   - 技术热点统计
#   - 个性化兴趣学习
# ===============================================================
storage:

  backend: "auto"

  formats:

    # 主数据库，必须开启
    sqlite: true

    txt: false

    # 保留网页报告
    html: true


  local:

    data_dir: "output"

    # 0 = 永久保留
    retention_days: 0


  remote:

    retention_days: 0

    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""


  pull:

    enabled: false

    days: 7


# ===============================================================
# 8. AI 模型配置
#
# ai_analysis
# ai_translation
# ai_filter
#
# 共用这一套模型
#
# 推荐通过环境变量传 Key：
#
# AI_API_KEY=sk-xxxxxxxx
#
# 不要把 Key 直接提交到 GitHub
# ===============================================================
ai:

  # DeepSeek V4 Flash
  # 足够处理：
  #
  #   - 新闻分类
  #   - 相关性评分
  #   - 标题翻译
  #   - 日报总结
  #
  model: "deepseek/deepseek-v4-flash"

  # 推荐留空，通过 AI_API_KEY 环境变量设置
  api_key: ""

  # 使用 DeepSeek 官方 API 时留空
  api_base: ""

  # RSS + AI Analysis 数据较多
  timeout: 180

  # DeepSeek 推荐保持 1.0
  temperature: 1.0

  # 日报最大生成长度
  max_tokens: 5000

  # API 网络异常自动重试
  num_retries: 2

  # 第一阶段不配置备用模型
  fallback_models: []


# ===============================================================
# 9. AI 分析
#
# DeepSeek 根据筛选后的资讯生成综合情报研判
# ===============================================================
ai_analysis:

  enabled: true

  language: "Chinese"

  prompt_file: "ai_analysis_prompt.txt"

  # 跟随 timeline 中不同时间段：
  #
  # 上午 → 当前重要资讯
  # 下班前 → 当日完整总结
  #
  mode: "follow_report"

  # 最多给 DeepSeek 80 条新闻做综合分析
  #
  # 防止 token 使用量过大
  max_news_for_analysis: 80

  # 非常重要：
  #
  # 将 OpenAI / Anthropic / arXiv / Mandiant /
  # Unit42 / 政府政策等 RSS 纳入 AI 分析
  include_rss: true

  # 当前不使用 standalone
  include_standalone: false

  # 不把热榜完整排名变化轨迹交给 DeepSeek
  #
  # 对技术情报价值有限
  # 关闭可明显节约 token
  include_rank_timeline: false


# ===============================================================
# 10. AI 翻译
#
# 主要针对英文技术 RSS
# ===============================================================
ai_translation:

  enabled: true

  language: "中文"

  prompt_file: "ai_translation_prompt.txt"

  batch_size: 100

  batch_interval: 2

  scope:

    # 国内热榜已经基本为中文
    hotlist: false

    # OpenAI / Anthropic / Mandiant / arXiv 等需要翻译
    rss: true

    standalone: false


# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:

  debug: false


  # -------------------------------------------------------------
  # 版本检查
  # -------------------------------------------------------------

  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"

  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"

  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"


  # -------------------------------------------------------------
  # 热榜抓取
  # -------------------------------------------------------------

  crawler:

    request_interval: 2000

    use_proxy: false

    default_proxy: "http://127.0.0.1:10801"


  # -------------------------------------------------------------
  # RSS 抓取
  # -------------------------------------------------------------

  rss:

    # 数据源较多，不建议请求太密
    request_interval: 1200

    # 国外 RSS / 公共 RSSHub 偶尔响应较慢
    timeout: 30

    use_proxy: false

    proxy_url: ""


  # -------------------------------------------------------------
  # 热榜排序权重
  # -------------------------------------------------------------

  weight:

    rank: 0.6

    frequency: 0.3

    hotness: 0.1


  # -------------------------------------------------------------
  # 推送
  # -------------------------------------------------------------

  max_accounts_per_channel: 3

  batch_size:

    default: 4000

    dingtalk: 20000

    feishu: 30000

    bark: 4000

    slack: 4000

  batch_send_interval: 3

  feishu_message_separator: "━━━━━━━━━━━━━━━━"
