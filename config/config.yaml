# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#              AI应用 / Agent落地 每日情报版
#
# 使用方式：
#   GitHub Actions 每天固定执行一次
#   TrendRadar 内部调度关闭
#   DeepSeek 负责 AI 筛选、翻译和分析
#
# 数据持久化：
#   TrendRadar 使用 local SQLite
#   GitHub Actions 通过 WebDAV/rclone
#   将 output/ 与 InfiniCLOUD 同步
#
# Version: 2.4.0
# ═══════════════════════════════════════════════════════════════


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true


# ===============================================================
# 1.5 调度系统
#
# 关闭 TrendRadar 内部时间窗口。
#
# 原因：
# 1. 不再使用 office_hours
# 2. 避免出现“当前时间段不执行推送”
# 3. 由 GitHub Actions cron 决定每天什么时候运行
#
# 注意：
# 如果 GitHub Actions 一天执行多次，
# 关闭调度后每次运行都可能分析并推送。
# 因此 workflow 应改成每天执行一次。
# ===============================================================
schedule:
  enabled: false
  preset: "morning_evening"


# ===============================================================
# 2. 热榜平台
#
# 热榜用于补充：
# 国家政策 / 科技产业 / 经济民生 / 社会重要事件
#
# AI应用情报的主要来源仍然是 RSS。
# ===============================================================
platforms:
  enabled: true
  api_url: ""

  sources:

    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"

    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"

    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"

    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"

    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"

    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"

    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"

    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"


# ===============================================================
# 3. RSS
#
# 原则：
# AI应用案例 > Agent工程 > 产品能力 > 政策
# > 少量安全 > 论文
#
# rsshub.app 政策源暂时关闭：
# GitHub Actions 出口请求公共 RSSHub 当前返回 403。
# 后续换成自建 RSSHub 后再开启。
# ===============================================================
rss:
  enabled: true

  freshness_filter:
    enabled: true
    max_age_days: 3

  feeds:

    # ===========================================================
    # 01 国家政策 / 政务
    #
    # 当前公共 rsshub.app 在 GitHub Actions 中返回 403，
    # 暂时关闭，避免每次运行产生大量失败日志。
    #
    # 自建 RSSHub 后将 enabled 改为 true，
    # 并把 rsshub.app 换成自己的域名。
    # ===========================================================

    - id: "gov-policy-latest"
      name: "政策｜中国政府网-最新政策"
      url: "https://rsshub.app/gov/zhengce/zuixin"
      enabled: false
      max_age_days: 3

    - id: "gov-department-news"
      name: "政策｜中国政府网-部门政务"
      url: "https://rsshub.app/gov/news/bm"
      enabled: false
      max_age_days: 3

    - id: "gov-policy-files"
      name: "政策｜国务院政策文件"
      url: "https://rsshub.app/gov/zhengce/wenjian"
      enabled: false
      max_age_days: 7

    - id: "miit-policy"
      name: "政策｜工信部-政策文件"
      url: "https://rsshub.app/gov/miit/zcwj"
      enabled: false
      max_age_days: 7

    - id: "miit-policy-explain"
      name: "政策｜工信部-政策解读"
      url: "https://rsshub.app/gov/miit/zcjd"
      enabled: false
      max_age_days: 7

    - id: "miit-consultation"
      name: "政策｜工信部-意见征集"
      url: "https://rsshub.app/gov/miit/yjzj"
      enabled: false
      max_age_days: 7

    - id: "npc-authoritative"
      name: "政策｜全国人大-权威发布"
      url: "https://rsshub.app/gov/npc/c12435"
      enabled: false
      max_age_days: 7

    - id: "npc-legislation"
      name: "政策｜全国人大-立法"
      url: "https://rsshub.app/gov/npc/c183"
      enabled: false
      max_age_days: 7

    - id: "moj-legislation"
      name: "政策｜司法部-立法意见征集"
      url: "https://rsshub.app/gov/moj/lfyjzj"
      enabled: false
      max_age_days: 7


    # ===========================================================
    # 02 AI / Agent 官方能力
    # ===========================================================

    - id: "openai-news"
      name: "AI｜OpenAI"
      url: "https://openai.com/news/rss.xml"
      enabled: true
      max_age_days: 5

    - id: "anthropic-engineering"
      name: "Agent｜Anthropic Engineering"
      url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/refs/heads/main/feeds/feed_anthropic_engineering.xml"
      enabled: true
      max_age_days: 5

    - id: "anthropic-news"
      name: "AI｜Anthropic News"
      url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/refs/heads/main/feeds/feed_anthropic_news.xml"
      enabled: true
      max_age_days: 5

    - id: "google-ai"
      name: "AI｜Google AI"
      url: "https://blog.google/innovation-and-ai/technology/ai/rss/"
      enabled: true
      max_age_days: 5

    - id: "deepmind"
      name: "AI｜Google DeepMind"
      url: "https://deepmind.google/blog/rss.xml"
      enabled: true
      max_age_days: 5

    - id: "huggingface"
      name: "AI｜Hugging Face"
      url: "https://huggingface.co/blog/feed.xml"
      enabled: true
      max_age_days: 5


    # ===========================================================
    # 03 AI应用 / 企业落地 / Agent生产案例
    # ===========================================================

    - id: "aws-ai-ml"
      name: "应用案例｜AWS AI & Machine Learning"
      url: "https://aws.amazon.com/blogs/machine-learning/feed/"
      enabled: true
      max_age_days: 5

    - id: "google-cloud"
      name: "应用案例｜Google Cloud"
      url: "https://cloudblog.withgoogle.com/rss/"
      enabled: true
      max_age_days: 5


    # ===========================================================
    # 04 网络安全 / AI安全
    #
    # 只保留少量高质量来源。
    # ===========================================================

    - id: "google-threat-intelligence"
      name: "安全｜Google Threat Intelligence / Mandiant"
      url: "https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v"
      enabled: true
      max_age_days: 5

    - id: "unit42"
      name: "安全｜Palo Alto Unit 42"
      url: "https://unit42.paloaltonetworks.com/feed/"
      enabled: true
      max_age_days: 5

    - id: "owasp-genai"
      name: "AI安全｜OWASP GenAI Security"
      url: "https://genai.owasp.org/feed/"
      enabled: true
      max_age_days: 7

    # 你之前运行时该 Feed 出现解析异常：
    # 'str' object has no attribute 'get'
    - id: "microsoft-security"
      name: "安全｜Microsoft Security"
      url: "https://www.microsoft.com/en-us/security/blog/feed/"
      enabled: false
      max_age_days: 5


    # ===========================================================
    # 05 技术社区 / Agent创意发现
    # ===========================================================

    - id: "hacker-news"
      name: "技术社区｜Hacker News"
      url: "https://hnrss.org/frontpage"
      enabled: true
      max_age_days: 2


    # ===========================================================
    # 06 论文
    #
    # 当前以应用落地为主，暂时全部关闭。
    # ===========================================================

    - id: "arxiv-ai"
      name: "论文｜arXiv cs.AI"
      url: "https://export.arxiv.org/rss/cs.AI"
      enabled: false
      max_age_days: 2

    - id: "arxiv-cl"
      name: "论文｜arXiv cs.CL"
      url: "https://export.arxiv.org/rss/cs.CL"
      enabled: false
      max_age_days: 2

    - id: "arxiv-security"
      name: "论文｜arXiv cs.CR"
      url: "https://export.arxiv.org/rss/cs.CR"
      enabled: false
      max_age_days: 2


# ===============================================================
# 4. 报告模式
#
# GitHub Actions 每日仅执行一次，
# 因此使用 daily 更符合“每日情报简报”。
# ===============================================================
report:
  mode: "daily"

  display_mode: "keyword"

  # 按 ai_interests.txt 的优先级显示
  sort_by_position_first: true

  rank_threshold: 5

  # 每个分类最多显示 6 条
  max_news_per_keyword: 6


# ===============================================================
# 4.5 AI筛选
# ===============================================================
filter:
  method: "ai"

  priority_sort_enabled: true


# ===============================================================
# 4.6 DeepSeek AI筛选
# ===============================================================
ai_filter:

  batch_size: 150

  batch_interval: 2

  # 保持较高召回率。
  # Agent应用案例的标题不一定包含明显技术关键词。
  min_score: 0.65

  reclassify_threshold: 0.75

  prompt_file: "prompt.txt"

  extract_prompt_file: "extract_prompt.txt"

  update_tags_prompt_file: "update_tags_prompt.txt"


# ===============================================================
# 5. 展示
#
# 阅读顺序：
#
# AI日报结论
# ↓
# 热榜补充
# ↓
# 专业RSS原文
# ===============================================================
display:

  region_order:
    - ai_analysis
    - hotlist
    - rss

  regions:

    hotlist: true

    new_items: false

    rss: true

    standalone: false

    ai_analysis: true


  standalone:

    platforms: []

    rss_feeds: []

    max_items: 10


# ===============================================================
# 6. 通知
# ===============================================================
notification:
  enabled: true

  channels:

    feishu:
      webhook_url: ""

    dingtalk:
      webhook_url: ""

    wework:
      webhook_url: ""
      msg_type: "markdown"

    telegram:
      bot_token: ""
      chat_id: ""

    # 邮件建议继续通过 GitHub Secrets / 环境变量配置
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""

    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""

    bark:
      url: ""

    slack:
      webhook_url: ""

    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 7. 存储
#
# 非常重要：
#
# InfiniCLOUD 是 WebDAV，不是 S3。
#
# 因此 TrendRadar 本身使用 local。
# GitHub Actions 在执行前后通过 rclone/WebDAV：
#
#   InfiniCLOUD → output/
#   output/ → InfiniCLOUD
#
# 不要把 backend 设置成 remote，
# 否则 TrendRadar 会要求 S3 参数。
# ===============================================================
storage:

  backend: "local"

  formats:

    # SQLite 是主状态存储
    sqlite: true

    txt: false

    # 邮件和网页简报需要 HTML
    html: true


  local:

    data_dir: "output"

    retention_days: 0


  # 不使用 TrendRadar 自带 S3 remote
  remote:

    retention_days: 0

    endpoint_url: ""

    bucket_name: ""

    access_key_id: ""

    secret_access_key: ""

    region: ""


  pull:

    # WebDAV 同步不走 TrendRadar pull
    enabled: false

    days: 7


# ===============================================================
# 8. DeepSeek
# ===============================================================
ai:

  model: "deepseek/deepseek-v4-flash"

  # 推荐环境变量 AI_API_KEY
  api_key: ""

  # DeepSeek 官方API留空
  api_base: ""

  timeout: 180

  temperature: 1.0

  max_tokens: 5000

  num_retries: 2

  fallback_models: []


# ===============================================================
# 9. AI分析
#
# 生成每日“AI应用与Agent落地情报简报”
# ===============================================================
ai_analysis:

  enabled: true

  language: "Chinese"

  prompt_file: "ai_analysis_prompt.txt"

  # 因为 report.mode 已固定 daily，
  # 跟随即可。
  mode: "follow_report"

  # AI Filter 已做第一层过滤，
  # 60 条足够做一次日报分析。
  max_news_for_analysis: 60

  # AI应用案例主要来自 RSS
  include_rss: true

  include_standalone: false

  # 不浪费 token 分析热榜排名轨迹
  include_rank_timeline: false


# ===============================================================
# 10. AI翻译
# ===============================================================
ai_translation:

  enabled: true

  language: "中文"

  prompt_file: "ai_translation_prompt.txt"

  batch_size: 100

  batch_interval: 2

  scope:

    # 国内热榜无需翻译
    hotlist: false

    # 英文专业RSS需要翻译
    rss: true

    standalone: false


# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:

  # 标签提取问题排查期间先开启。
  # 等 AI Filter 修好后可以改回 false。
  debug: true


  # -------------------------------------------------------------
  # 版本检查
  # -------------------------------------------------------------

  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"

  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"

  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"


  # -------------------------------------------------------------
  # 热榜
  # -------------------------------------------------------------

  crawler:

    request_interval: 2000

    use_proxy: false

    default_proxy: "http://127.0.0.1:10801"


  # -------------------------------------------------------------
  # RSS
  # -------------------------------------------------------------

  rss:

    request_interval: 1200

    timeout: 30

    use_proxy: false

    proxy_url: ""


  # -------------------------------------------------------------
  # 热榜排序权重
  # -------------------------------------------------------------

  weight:

    rank: 0.6

    frequency: 0.3

    hotness: 0.1


  max_accounts_per_channel: 3


  batch_size:

    default: 4000

    dingtalk: 20000

    feishu: 30000

    bark: 4000

    slack: 4000


  batch_send_interval: 3

  feishu_message_separator: "━━━━━━━━━━━━━━━━"
