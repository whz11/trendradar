# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#                  AI 应用落地情报版
#
# 核心关注：
#   AI应用案例 > Agent创意 > 业务落地 > 实际成效
#   > 工程实践 > AI产品能力 > 政策 > 少量安全/前沿技术
#
# Version: 2.4.0
# ═══════════════════════════════════════════════════════════════


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true


# ===============================================================
# 1.5 调度系统
#
# office_hours：
# 工作日到岗 / 午间 / 收工三个时间段
# 具体时间在 config/timeline.yaml 中配置
# ===============================================================
schedule:
  enabled: true
  preset: "office_hours"


# ===============================================================
# 2. 热榜平台
#
# 热榜不是核心技术源。
# 主要用于补充：
#   - 国家政策
#   - 社会热点
#   - 经济民生
#   - 中国科技产业动态
# ===============================================================
platforms:
  enabled: true
  api_url: ""

  sources:

    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"

    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"

    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"

    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"

    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"

    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"

    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"

    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"


# ===============================================================
# 3. RSS 数据源
#
# 设计原则：
#
# AI应用/企业案例      高优先级
# Agent工程实践        高优先级
# AI产品能力           高优先级
# 国家政策             中高优先级
# 网络安全             少量精选
# 论文                 默认关闭
#
# ===============================================================
rss:
  enabled: true

  freshness_filter:
    enabled: true
    max_age_days: 2

  feeds:

    # ===========================================================
    # 01 国家政策 / 政务
    # ===========================================================

    - id: "gov-policy-latest"
      name: "政策｜中国政府网-最新政策"
      url: "https://rsshub.app/gov/zhengce/zuixin"
      max_age_days: 3

    - id: "gov-department-news"
      name: "政策｜中国政府网-部门政务"
      url: "https://rsshub.app/gov/news/bm"
      max_age_days: 2

    - id: "gov-policy-files"
      name: "政策｜国务院政策文件"
      url: "https://rsshub.app/gov/zhengce/wenjian"
      max_age_days: 7

    - id: "miit-policy"
      name: "政策｜工信部-政策文件"
      url: "https://rsshub.app/gov/miit/zcwj"
      max_age_days: 7

    - id: "miit-policy-explain"
      name: "政策｜工信部-政策解读"
      url: "https://rsshub.app/gov/miit/zcjd"
      max_age_days: 7

    - id: "miit-consultation"
      name: "政策｜工信部-意见征集"
      url: "https://rsshub.app/gov/miit/yjzj"
      max_age_days: 7

    - id: "npc-authoritative"
      name: "政策｜全国人大-权威发布"
      url: "https://rsshub.app/gov/npc/c12435"
      max_age_days: 7

    - id: "npc-legislation"
      name: "政策｜全国人大-立法"
      url: "https://rsshub.app/gov/npc/c183"
      max_age_days: 7

    - id: "moj-legislation"
      name: "政策｜司法部-立法意见征集"
      url: "https://rsshub.app/gov/moj/lfyjzj"
      max_age_days: 7


    # ===========================================================
    # 02 AI / Agent 官方能力与产品
    #
    # 关注重点：
    # 新能力能不能带来新的应用方式
    # ===========================================================

    - id: "openai-news"
      name: "AI｜OpenAI"
      url: "https://openai.com/news/rss.xml"
      max_age_days: 3

    - id: "anthropic-engineering"
      name: "Agent｜Anthropic Engineering"
      url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/refs/heads/main/feeds/feed_anthropic_engineering.xml"
      max_age_days: 5

    - id: "anthropic-news"
      name: "AI｜Anthropic News"
      url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/refs/heads/main/feeds/feed_anthropic_news.xml"
      max_age_days: 3

    - id: "google-ai"
      name: "AI｜Google AI"
      url: "https://blog.google/innovation-and-ai/technology/ai/rss/"
      max_age_days: 3

    - id: "deepmind"
      name: "AI｜Google DeepMind"
      url: "https://deepmind.google/blog/rss.xml"
      max_age_days: 5

    - id: "huggingface"
      name: "AI｜Hugging Face"
      url: "https://huggingface.co/blog/feed.xml"
      max_age_days: 5


    # ===========================================================
    # 03 AI 应用 / 企业落地 / Agent 工程案例
    #
    # 这是当前最重要的一组来源
    # ===========================================================

    - id: "aws-ai-ml"
      name: "应用案例｜AWS AI & Machine Learning"
      url: "https://aws.amazon.com/blogs/machine-learning/feed/"
      max_age_days: 5

    - id: "google-cloud"
      name: "应用案例｜Google Cloud"
      url: "https://cloudblog.withgoogle.com/rss/"
      max_age_days: 5


    # ===========================================================
    # 04 网络安全中的 AI / 少量重要安全情报
    #
    # 不追求覆盖全部 CVE。
    # 只保留真实威胁、AI安全、安全运营和可借鉴案例。
    # ===========================================================

    - id: "google-threat-intelligence"
      name: "安全｜Google Threat Intelligence / Mandiant"
      url: "https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v"
      max_age_days: 5

    - id: "microsoft-security"
      name: "安全｜Microsoft Security"
      url: "https://www.microsoft.com/en-us/security/blog/feed/"
      max_age_days: 5

    - id: "unit42"
      name: "安全｜Palo Alto Unit 42"
      url: "https://unit42.paloaltonetworks.com/feed/"
      max_age_days: 5

    - id: "owasp-genai"
      name: "AI安全｜OWASP GenAI Security"
      url: "https://genai.owasp.org/feed/"
      max_age_days: 7


    # ===========================================================
    # 05 技术社区 / 创意发现
    #
    # 用于发现：
    #   新 Agent 项目
    #   新应用创意
    #   新型 AI 工具
    # ===========================================================

    - id: "hacker-news"
      name: "技术社区｜Hacker News"
      url: "https://hnrss.org/frontpage"
      max_age_days: 2


    # ===========================================================
    # 06 论文
    #
    # 默认关闭。
    #
    # 当前目标不是追踪底层研究，
    # 而是发现 AI 应用和 Agent 创意。
    #
    # 如果后续希望增加前沿探索，可手动开启 cs.AI。
    # ===========================================================

    - id: "arxiv-ai"
      name: "论文｜arXiv cs.AI"
      url: "https://export.arxiv.org/rss/cs.AI"
      enabled: false
      max_age_days: 2

    - id: "arxiv-cl"
      name: "论文｜arXiv cs.CL"
      url: "https://export.arxiv.org/rss/cs.CL"
      enabled: false
      max_age_days: 2

    - id: "arxiv-security"
      name: "论文｜arXiv cs.CR"
      url: "https://export.arxiv.org/rss/cs.CR"
      enabled: false
      max_age_days: 2


    # ===========================================================
    # 07 GitHub Trending
    #
    # 自建 RSSHub 并配置 GitHub Token 后建议开启。
    #
    # 对发现 Agent 创意和新项目价值很高。
    # ===========================================================

    # - id: "github-trending"
    #   name: "技术社区｜GitHub Trending"
    #   url: "http://rsshub:1200/github/trending/daily/any"
    #   max_age_days: 2


# ===============================================================
# 4. 报告模式
# ===============================================================
report:

  # 开启 schedule 后会被 timeline.yaml 对应时段覆盖
  mode: "current"

  # 按 AI 兴趣标签分类
  display_mode: "keyword"

  # 按 ai_interests.txt 中的兴趣优先级排列
  sort_by_position_first: true

  rank_threshold: 5

  # 每个分类最多展示 6 条
  #
  # 对你的需求来说，比 8 条更舒服：
  # 目标是发现案例，不是阅读新闻瀑布流
  max_news_per_keyword: 6


# ===============================================================
# 4.5 AI 筛选
# ===============================================================
filter:

  # 使用 DeepSeek 进行语义筛选
  method: "ai"

  # ai_interests.txt 上面的类别优先展示
  priority_sort_enabled: true


# ===============================================================
# 4.6 DeepSeek AI 筛选配置
# ===============================================================
ai_filter:

  # 150 条 / 批
  # 减少重复 Prompt 开销，同时控制上下文大小
  batch_size: 150

  batch_interval: 2

  # 应用创意有时候标题不明显，
  # 因此不要设得过高。
  min_score: 0.65

  # 尽量复用历史分类结果
  reclassify_threshold: 0.75

  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"


# ===============================================================
# 5. 展示配置
#
# 使用逻辑：
#
# ① 先读 AI 综合研判
# ② 再看筛选后的热点
# ③ 再看具体 RSS 原文
#
# ===============================================================
display:

  region_order:
    - ai_analysis
    - hotlist
    - rss

  regions:

    hotlist: true

    # 避免重复
    new_items: false

    # 保留原始文章入口
    rss: true

    # 不展示未经 AI 筛选的整个来源
    standalone: false

    ai_analysis: true


  standalone:

    platforms: []

    rss_feeds: []

    max_items: 10


# ===============================================================
# 6. 推送通知
#
# 推荐：
#   飞书 / 企业微信 / Email
#
# Webhook 和密码不要写进公开仓库。
# ===============================================================
notification:

  enabled: true

  channels:

    feishu:
      webhook_url: ""

    dingtalk:
      webhook_url: ""

    wework:
      webhook_url: ""
      msg_type: "markdown"

    telegram:
      bot_token: ""
      chat_id: ""

    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""

    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""

    bark:
      url: ""

    slack:
      webhook_url: ""

    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 7. 存储
#
# 历史资讯建议长期保存。
#
# 后续可以逐渐形成：
#
# AI 应用案例库
# Agent 创意库
# 政务 AI 案例库
# 网络安全 AI 案例库
#
# ===============================================================
storage:

  backend: "auto"

  formats:

    # 主数据库
    sqlite: true

    txt: false

    # 保留网页报告
    html: true


  local:

    data_dir: "output"

    # 永久保留
    retention_days: 0


  remote:

    retention_days: 0

    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""


  pull:

    enabled: false

    days: 7


# ===============================================================
# 8. DeepSeek 模型配置
#
# ai_filter
# ai_analysis
# ai_translation
#
# 当前共用一个模型。
#
# 推荐通过环境变量传入：
#
# AI_API_KEY=sk-xxxxx
# AI_MODEL=deepseek/deepseek-v4-flash
#
# ===============================================================
ai:

  model: "deepseek/deepseek-v4-flash"

  # 推荐通过 AI_API_KEY 环境变量设置
  api_key: ""

  # DeepSeek 官方 API 时留空
  api_base: ""

  timeout: 180

  temperature: 1.0

  # 日报不需要特别长
  max_tokens: 5000

  num_retries: 2

  fallback_models: []


# ===============================================================
# 9. AI 综合分析
#
# 这一部分不是简单“总结新闻”。
#
# 后续 ai_analysis_prompt.txt 应重点输出：
#
#   今日值得关注
#   AI 应用案例
#   Agent 创意
#   落地效果
#   可以借鉴什么
#   哪些值得进一步研究
#
# ===============================================================
ai_analysis:

  enabled: true

  language: "Chinese"

  prompt_file: "ai_analysis_prompt.txt"

  # 跟随 timeline：
  # 上午 current
  # 下班前 daily
  mode: "follow_report"

  # 从原来 80 降到 60
  #
  # AI Filter 已经进行了第一轮筛选，
  # 不需要把太多内容再次送给模型。
  max_news_for_analysis: 60

  # AI应用案例主要来自 RSS，必须开启
  include_rss: true

  include_standalone: false

  # 不分析热榜排名轨迹
  include_rank_timeline: false


# ===============================================================
# 10. AI 翻译
#
# 主要翻译：
#
# OpenAI
# Anthropic
# AWS
# Google Cloud
# Mandiant
# Microsoft Security
#
# ===============================================================
ai_translation:

  enabled: true

  language: "中文"

  prompt_file: "ai_translation_prompt.txt"

  batch_size: 100

  batch_interval: 2

  scope:

    # 国内热榜已经是中文
    hotlist: false

    # 英文 RSS 翻译
    rss: true

    standalone: false


# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:

  debug: false


  # -------------------------------------------------------------
  # 版本检查
  # -------------------------------------------------------------

  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"

  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"

  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"


  # -------------------------------------------------------------
  # 热榜爬虫
  # -------------------------------------------------------------

  crawler:

    request_interval: 2000

    use_proxy: false

    default_proxy: "http://127.0.0.1:10801"


  # -------------------------------------------------------------
  # RSS
  # -------------------------------------------------------------

  rss:

    request_interval: 1200

    # 公共 RSSHub / 国外网站适当放宽超时
    timeout: 30

    use_proxy: false

    proxy_url: ""


  # -------------------------------------------------------------
  # 热榜排序权重
  # -------------------------------------------------------------

  weight:

    rank: 0.6

    frequency: 0.3

    hotness: 0.1


  # -------------------------------------------------------------
  # 推送限制
  # -------------------------------------------------------------

  max_accounts_per_channel: 3

  batch_size:

    default: 4000

    dingtalk: 20000

    feishu: 30000

    bark: 4000

    slack: 4000

  batch_send_interval: 3

  feishu_message_separator: "━━━━━━━━━━━━━━━━"
