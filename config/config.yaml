    - id: "owasp-genai"
      name: "AI安全｜OWASP GenAI Security"
      url: "https://genai.owasp.org/feed/"
      enabled: true
      max_age_days: 7

    # 当前 TrendRadar 解析出现异常，暂时关闭
    - id: "microsoft-security"
      name: "安全｜Microsoft Security"
      url: "https://www.microsoft.com/en-us/security/blog/feed/"
      enabled: false
      max_age_days: 5


    # ===========================================================
    # 05 技术社区
    #
    # 用于发现 Agent 创意、开源项目、工程趋势。
    # ===========================================================

    - id: "hacker-news"
      name: "技术社区｜Hacker News"
      url: "https://hnrss.org/frontpage"
      enabled: true
      max_age_days: 2


    # ===========================================================
    # 06 论文
    #
    # 当前关注应用而非科研论文，默认关闭。
    # ===========================================================

    - id: "arxiv-ai"
      name: "论文｜arXiv cs.AI"
      url: "https://export.arxiv.org/rss/cs.AI"
      enabled: false
      max_age_days: 2

    - id: "arxiv-cl"
      name: "论文｜arXiv cs.CL"
      url: "https://export.arxiv.org/rss/cs.CL"
      enabled: false
      max_age_days: 2

    - id: "arxiv-security"
      name: "论文｜arXiv cs.CR"
      url: "https://export.arxiv.org/rss/cs.CR"
      enabled: false
      max_age_days: 2


# ===============================================================
# 4. 报告
#
# GitHub Actions 每天运行一次，
# 输出当天综合日报。
# ===============================================================
report:
  mode: "daily"

  display_mode: "keyword"

  # 优先按照 ai_interests.txt 的兴趣顺序
  sort_by_position_first: true

  rank_threshold: 5

  # 避免单个类别占满简报
  max_news_per_keyword: 6


# ===============================================================
# 4.5 AI筛选
# ===============================================================
filter:
  method: "ai"

  priority_sort_enabled: true


# ===============================================================
# 4.6 DeepSeek AI筛选
# ===============================================================
ai_filter:

  batch_size: 150

  batch_interval: 2

  # 保持较高召回率。
  #
  # Context Engineering / Agent Memory 等文章
  # 标题可能不会直接写“应用案例”，不能筛得太严。
  min_score: 0.65

  reclassify_threshold: 0.75

  prompt_file: "prompt.txt"

  extract_prompt_file: "extract_prompt.txt"

  update_tags_prompt_file: "update_tags_prompt.txt"


# ===============================================================
# 5. 展示
#
# 双轨：
#
# 第一轨：
# standalone = 每日时政 / 经济 / 民生保底
#
# 第二轨：
# hotlist + rss = DeepSeek 根据兴趣精筛
# ===============================================================
display:

  region_order:
    - ai_analysis
    - standalone
    - hotlist
    - rss

  regions:

    hotlist: true

    new_items: false

    rss: true

    # 关键：
    # 每日时政不经过 AI Filter
    standalone: true

    ai_analysis: true


  standalone:

    # 每日综合信息保底
    platforms:
      - "thepaper"
      - "toutiao"
      - "baidu"
      - "cls-hot"

    rss_feeds: []

    # 每个平台前5条
    # 最大20条，不至于压过专业内容
    max_items: 5


# ===============================================================
# 6. 推送
# ===============================================================
notification:

  enabled: true

  channels:

    feishu:
      webhook_url: ""

    dingtalk:
      webhook_url: ""

    wework:
      webhook_url: ""
      msg_type: "markdown"

    telegram:
      bot_token: ""
      chat_id: ""

    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""

    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""

    bark:
      url: ""

    slack:
      webhook_url: ""

    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 7. 存储
#
# InfiniCLOUD 使用 WebDAV。
#
# TrendRadar 本身继续使用 local SQLite，
# GitHub Actions 运行前后通过 rclone
# 与 InfiniCLOUD 同步 output/ 状态。
# ===============================================================
storage:

  backend: "local"

  formats:

    sqlite: true

    txt: false

    html: true


  local:

    data_dir: "output"

    retention_days: 0


  remote:

    retention_days: 0

    endpoint_url: ""

    bucket_name: ""

    access_key_id: ""

    secret_access_key: ""

    region: ""


  pull:

    enabled: false

    days: 7


# ===============================================================
# 8. DeepSeek
# ===============================================================
ai:

  model: "deepseek/deepseek-v4-flash"

  # 推荐 GitHub Secret：
  # AI_API_KEY
  api_key: ""

  api_base: ""

  timeout: 180

  temperature: 1.0

  max_tokens: 5000

  num_retries: 2

  fallback_models: []


# ===============================================================
# 9. AI综合分析
#
# 同时分析：
#
# AI筛选后的内容
# +
# RSS专业资讯
# +
# 每日时政 standalone
# ===============================================================
ai_analysis:

  enabled: true

  language: "Chinese"

  prompt_file: "ai_analysis_prompt.txt"

  mode: "follow_report"

  max_news_for_analysis: 60

  include_rss: true

  # 关键：
  # 让 DeepSeek 看到每日时政热点
  include_standalone: true

  # 不分析完整排名轨迹，节约Token
  include_rank_timeline: false


# ===============================================================
# 10. AI翻译
# ===============================================================
ai_translation:

  enabled: true

  language: "中文"

  prompt_file: "ai_translation_prompt.txt"

  batch_size: 100

  batch_interval: 2

  scope:

    hotlist: false

    rss: true

    # standalone 都是中文热榜
    standalone: false


# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:

  # 目前 AI 标签提取仍在排查，
  # 暂时保持 true。
  #
  # 确认正常后改成 false。
  debug: false


  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"

  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"

  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"


  crawler:

    request_interval: 2000

    use_proxy: false

    default_proxy: "http://127.0.0.1:10801"


  rss:

    request_interval: 1200

    timeout: 30

    use_proxy: false

    proxy_url: ""


  weight:

    rank: 0.6

    frequency: 0.3

    hotness: 0.1


  max_accounts_per_channel: 3


  batch_size:

    default: 4000

    dingtalk: 20000

    feishu: 30000

    bark: 4000

    slack: 4000


  batch_send_interval: 3

  feishu_message_separator: "━━━━━━━━━━━━━━━━"
