name: TrendRadar Daily Briefing

on:
  schedule:
    # 每天北京时间 08:17
    # 使用非整点分钟，避开 GitHub Actions 调度高峰
    - cron: "53 2 * * *"
  # 允许手动运行测试
  workflow_dispatch:


# ============================================================
# 防止重复运行
#
# 如果定时任务正在执行，此时又手动 Run workflow，
# 第二个任务会等待前一个任务结束，而不是同时运行。
#
# 这样可以避免：
# - 同时发送两封邮件
# - 同时写 SQLite
# - 同时覆盖 InfiniCLOUD state
# ============================================================
concurrency:
  group: trendradar-daily
  cancel-in-progress: false


permissions:
  contents: read


jobs:
  crawl:
    runs-on: ubuntu-latest

    # 包含随机延迟、RSS抓取、AI分析和WebDAV上传
    timeout-minutes: 30

    steps:

      # ========================================================
      # 1. Checkout
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true


      # ========================================================
      # 2. Python
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ========================================================
      # 3. uv
      # ========================================================
      - name: Install uv
        uses: astral-sh/setup-uv@v7


      # ========================================================
      # 4. 安装项目依赖
      # ========================================================
      - name: Install dependencies
        run: |
          set -euo pipefail

          uv sync --frozen --no-dev


      # ========================================================
      # 5. 安装 rclone
      #
      # InfiniCLOUD 使用 WebDAV。
      # TrendRadar 本身仍然使用 local SQLite。
      #
      # rclone 负责：
      #
      # InfiniCLOUD
      #     ↓
      # output/
      #     ↓
      # TrendRadar
      #     ↓
      # output/
      #     ↓
      # InfiniCLOUD
      # ========================================================
      - name: Install rclone
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y rclone

          echo "=============================="
          echo "rclone version"
          echo "=============================="

          rclone version


      # ========================================================
      # 6. 配置 InfiniCLOUD WebDAV
      #
      # GitHub Secrets：
      #
      # INFINICLOUD_WEBDAV_URL
      # INFINICLOUD_USER
      # INFINICLOUD_APP_PASSWORD
      #
      # 密码不会写入代码仓库。
      # ========================================================
      - name: Configure InfiniCLOUD WebDAV
        env:
          INFINICLOUD_WEBDAV_URL: ${{ secrets.INFINICLOUD_WEBDAV_URL }}
          INFINICLOUD_USER: ${{ secrets.INFINICLOUD_USER }}
          INFINICLOUD_APP_PASSWORD: ${{ secrets.INFINICLOUD_APP_PASSWORD }}

        run: |
          set -euo pipefail

          echo "Checking InfiniCLOUD configuration..."

          if [ -z "${INFINICLOUD_WEBDAV_URL:-}" ]; then
            echo "ERROR: INFINICLOUD_WEBDAV_URL is empty"
            exit 1
          fi

          if [ -z "${INFINICLOUD_USER:-}" ]; then
            echo "ERROR: INFINICLOUD_USER is empty"
            exit 1
          fi

          if [ -z "${INFINICLOUD_APP_PASSWORD:-}" ]; then
            echo "ERROR: INFINICLOUD_APP_PASSWORD is empty"
            exit 1
          fi


          mkdir -p ~/.config/rclone
          chmod 700 ~/.config/rclone


          # 避免把原始密码直接写入 rclone.conf
          OBSCURED_PASSWORD="$(
            printf '%s\n' "${INFINICLOUD_APP_PASSWORD}" \
              | rclone obscure -
          )"


          # 确保生成文件只有当前用户可读
          umask 077


          cat > ~/.config/rclone/rclone.conf <<EOF
          [infinicloud]
          type = webdav
          url = ${INFINICLOUD_WEBDAV_URL}
          vendor = other
          user = ${INFINICLOUD_USER}
          pass = ${OBSCURED_PASSWORD}
          EOF


          echo "Testing InfiniCLOUD connection..."


          rclone lsd infinicloud: \
            --timeout 30s \
            --contimeout 15s \
            --retries 3 \
            --low-level-retries 5


          echo "InfiniCLOUD connection OK"


      # ========================================================
      # 7. 创建 TrendRadar 远程目录
      # ========================================================
      - name: Prepare InfiniCLOUD directory
        run: |
          set -euo pipefail

          rclone mkdir infinicloud:TrendRadar

          echo "Remote directory ready:"
          echo "infinicloud:TrendRadar"


      # ========================================================
      # 8. 恢复历史状态
      #
      # 远程：
      #
      # TrendRadar/state.tar.gz
      #
      # ↓
      #
      # 本地：
      #
      # output/
      #
      #
      # 注意：
      #
      # WebDAV连接失败 ≠ 第一次运行。
      #
      # 如果连接失败，这里直接终止 workflow，
      # 防止 TrendRadar 从空数据库重新运行并发送重复邮件。
      # ========================================================
      - name: Restore TrendRadar state
        run: |
          set -euo pipefail

          mkdir -p output


          echo "========================================"
          echo "Checking remote TrendRadar state"
          echo "========================================"


          # 单独获取文件列表。
          #
          # 如果 rclone/WebDAV 失败，
          # set -e 会直接终止任务。
          #
          # 不会误判成第一次运行。
          rclone lsf infinicloud:TrendRadar \
            --files-only \
            --timeout 30s \
            --contimeout 15s \
            --retries 3 \
            --low-level-retries 5 \
            > /tmp/infinicloud-files.txt


          if grep -Fxq "state.tar.gz" /tmp/infinicloud-files.txt; then

            echo "Existing TrendRadar state found."


            echo "Downloading state..."


            rclone copyto \
              infinicloud:TrendRadar/state.tar.gz \
              /tmp/trendradar-state.tar.gz \
              --retries 3 \
              --low-level-retries 10 \
              --timeout 2m


            echo "Validating state archive..."


            # 先检查压缩包有没有损坏
            tar -tzf /tmp/trendradar-state.tar.gz > /dev/null


            echo "Archive validation OK."


            echo "Extracting previous state..."


            tar -xzf /tmp/trendradar-state.tar.gz \
              -C "${GITHUB_WORKSPACE}"


            echo "State restored successfully."


            echo ""
            echo "Existing SQLite databases:"
            echo "----------------------------------------"


            find output \
              -type f \
              -name "*.db" \
              | sort \
              | tail -20 \
              || true


            echo ""
            echo "Current output size:"
            du -sh output || true

          else

            echo "No existing TrendRadar state."
            echo "This appears to be the first run."

          fi


      # ========================================================
      # 9. 验证必要配置文件
      # ========================================================
      - name: Verify configuration
        run: |
          set -euo pipefail


          REQUIRED_FILES=(
            "config/config.yaml"
            "config/ai_interests.txt"
            "config/ai_analysis_prompt.txt"
          )


          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "${FILE}" ]; then
              echo "ERROR: Missing required file: ${FILE}"
              exit 1
            fi

          done


          echo "Configuration files OK"


      # ========================================================
      # 10. TRAFFIC CONTROL / 流量控制
      #
      # 继承原 crawler.yml 的设计：
      #
      # 定时任务启动后随机等待 1~300 秒。
      #
      # 作用：
      # - 避免大量 TrendRadar 用户在同一时间请求数据源
      # - 降低 RSS / API 瞬时压力
      #
      # 注意：
      #
      # 这里只对 schedule 生效。
      #
      # 手动 workflow_dispatch 测试时不会等待。
      # ========================================================
      - name: Random Delay (Traffic Control)
        if: github.event_name == 'schedule'

        run: |
          set -euo pipefail


          echo "🎲 Traffic Control: generating random delay..."


          DELAY=$(( ( RANDOM % 300 ) + 1 ))


          echo "⏸️ Sleeping for ${DELAY} seconds..."


          sleep "${DELAY}"


          echo "▶️ Delay finished. Starting TrendRadar..."


      # ========================================================
      # 11. 运行 TrendRadar
      #
      # AI_MODEL / AI_API_BASE 不再在这里设置。
      #
      # 原因：
      #
      # config/config.yaml 已经指定模型，例如：
      #
      # ai:
      #   model: "deepseek/deepseek-v4-flash"
      #   api_base: ""
      #
      # 如果 workflow 再提供 AI_MODEL，
      # GitHub Secret 里的旧值可能覆盖 config.yaml。
      #
      # 所以这里只传真正的 Secret：AI_API_KEY。
      # ========================================================
      - name: Run TrendRadar

        env:

          # ====================================================
          # Email
          # ====================================================

          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}

          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}


          # ====================================================
          # DeepSeek
          # ====================================================

          AI_API_KEY: ${{ secrets.AI_API_KEY }}


          # ====================================================
          # 其他通知渠道（可选）
          # ====================================================

          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}

          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}

          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}

          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}

          BARK_URL: ${{ secrets.BARK_URL }}

          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


          # ====================================================
          # 通用 Webhook
          # ====================================================

          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}

          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}


          # ====================================================
          # GitHub Actions 环境标记
          # ====================================================

          GITHUB_ACTIONS: "true"


        run: |
          set -euo pipefail


          echo "========================================"
          echo "Starting TrendRadar"
          echo "========================================"


          uv run python -m trendradar


          echo ""
          echo "========================================"
          echo "TrendRadar finished successfully"
          echo "========================================"


      # ========================================================
      # 12. 查看本次产生的数据
      # ========================================================
      - name: Show storage status
        if: success()

        run: |
          echo "========================================"
          echo "TrendRadar storage status"
          echo "========================================"


          echo ""
          echo "Output size:"
          du -sh output || true


          echo ""
          echo "SQLite databases:"
          echo "----------------------------------------"


          find output \
            -type f \
            -name "*.db" \
            | sort \
            || true


          echo ""
          echo "Latest reports:"
          echo "----------------------------------------"


          find output/html \
            -type f \
            2>/dev/null \
            | sort \
            | tail -10 \
            || true


      # ========================================================
      # 13. 打包状态
      #
      # 不直接 rclone sync output/
      #
      # 原因：
      #
      # WebDAV 对 mtime / hash 支持有限，
      # SQLite + HTML 又会产生大量小文件。
      #
      # 每次打成一个 state.tar.gz：
      #
      # - 请求更少
      # - 恢复简单
      # - 不依赖mtime
      # - 更适合 GitHub Actions
      # ========================================================
      - name: Package TrendRadar state
        if: success()

        run: |
          set -euo pipefail


          echo "Packaging TrendRadar state..."


          tar -czf \
            /tmp/trendradar-state.tar.gz \
            output


          echo ""
          echo "State archive:"


          ls -lh /tmp/trendradar-state.tar.gz


          echo ""
          echo "Validating local archive..."


          tar -tzf \
            /tmp/trendradar-state.tar.gz \
            > /dev/null


          echo "Local archive validation OK"


      # ========================================================
      # 14. 上传新的状态
      #
      # 不直接覆盖：
      #
      # state.tar.gz
      #
      # 而是先：
      #
      # state.new.tar.gz
      #
      # 上传并验证成功以后，
      # 再替换正式 state.tar.gz。
      #
      # 防止上传中断破坏唯一备份。
      # ========================================================
      - name: Upload new state to InfiniCLOUD
        if: success()

        run: |
          set -euo pipefail


          echo "========================================"
          echo "Uploading new TrendRadar state"
          echo "========================================"


          rclone copyto \
            /tmp/trendradar-state.tar.gz \
            infinicloud:TrendRadar/state.new.tar.gz \
            --retries 3 \
            --low-level-retries 10 \
            --timeout 2m


          echo ""
          echo "Upload completed."


      # ========================================================
      # 15. 验证远程文件大小
      # ========================================================
      - name: Verify uploaded state
        if: success()

        run: |
          set -euo pipefail


          LOCAL_SIZE="$(
            stat -c%s /tmp/trendradar-state.tar.gz
          )"


          REMOTE_SIZE="$(
            rclone size \
              infinicloud:TrendRadar/state.new.tar.gz \
              --json \
              | python -c \
                'import json,sys; print(json.load(sys.stdin)["bytes"])'
          )"


          echo "Local size : ${LOCAL_SIZE}"
          echo "Remote size: ${REMOTE_SIZE}"


          if [ "${LOCAL_SIZE}" != "${REMOTE_SIZE}" ]; then

            echo "ERROR: InfiniCLOUD backup size mismatch"

            exit 1

          fi


          echo "Remote state validation OK"


      # ========================================================
      # 16. 替换正式状态
      #
      # state.new.tar.gz
      #
      #       ↓
      #
      # state.tar.gz
      # ========================================================
      - name: Commit InfiniCLOUD state
        if: success()

        run: |
          set -euo pipefail


          echo "Replacing previous TrendRadar state..."


          rclone moveto \
            infinicloud:TrendRadar/state.new.tar.gz \
            infinicloud:TrendRadar/state.tar.gz \
            --retries 3 \
            --low-level-retries 10 \
            --timeout 2m


          echo "Backup committed successfully."


      # ========================================================
      # 17. 最终验证
      # ========================================================
      - name: Verify InfiniCLOUD backup
        if: success()

        run: |
          set -euo pipefail


          echo "========================================"
          echo "Remote TrendRadar files"
          echo "========================================"


          rclone lsl \
            infinicloud:TrendRadar \
            --timeout 30s


          echo ""
          echo "========================================"
          echo "Workflow completed successfully"
          echo "========================================"
